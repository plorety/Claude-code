name: Build Windows exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  PRESENTMON_VERSION: "2.3.0"
  PRESENTMON_SHA256: "690533cf5c2591ef571a3037aa4c205c8e75860ef3f56927bf3a98acf7198485"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check the app imports
        run: python -c "import toolkit.ui, toolkit.tweaks, toolkit.actions, toolkit.benchmark"

      - name: Run the system test on Windows
        run: python -c "from toolkit import benchmark as B; print(B.system_test(print))"

      - name: Crosshair overlay smoke test
        timeout-minutes: 3
        run: |
          python -m pip install pillow
          python tests/smoke_overlay.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-screenshot
          path: overlay-smoke.png
          if-no-files-found: ignore

      - name: Download PresentMon
        shell: pwsh
        run: |
          $url = "https://github.com/GameTechDev/PresentMon/releases/download/v$env:PRESENTMON_VERSION/PresentMon-$env:PRESENTMON_VERSION-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile PresentMon.exe
          $hash = (Get-FileHash PresentMon.exe -Algorithm SHA256).Hash
          "PresentMon SHA256: $hash"
          if ($hash -ne $env:PRESENTMON_SHA256) { "Checksum mismatch, refusing to bundle"; exit 1 }

      - name: Check PresentMon accepts the app's options
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\PresentMon.exe -NoNewWindow -PassThru -ArgumentList @(
            "--process_name", "FortniteClient-Win64-Shipping.exe", "--output_file", "pm-check.csv",
            "--timed", "2", "--terminate_after_timed", "--terminate_on_proc_exit",
            "--stop_existing_session", "--session_name", "FPSToolkit",
            "--no_console_stats", "--v1_metrics")
          if (-not $p.WaitForExit(60000)) { $p.Kill(); "PresentMon did not stop within 60 s"; exit 1 }
          "PresentMon exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name FPSToolkit --collect-data customtkinter
          --add-binary "PresentMon.exe;." fps_toolkit.py

      - uses: actions/upload-artifact@v4
        with:
          name: FPSToolkit
          path: dist/FPSToolkit.exe
